name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify Bash launcher executable mode
        run: python -c "import subprocess; s=subprocess.check_output(['git','ls-tree','HEAD','obsidian_manager.sh'], text=True); print(s.strip()); assert s.startswith('100755 '), 'obsidian_manager.sh must be committed as mode 100755'"
      - name: Install optional cross-platform TLS certificate providers
        run: python -m pip install -r requirements-ssl.txt
      - name: Compile Python
        run: python -m py_compile obsidian_manager.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Bash launcher syntax
        if: runner.os != 'Windows'
        run: bash -n obsidian_manager.sh
