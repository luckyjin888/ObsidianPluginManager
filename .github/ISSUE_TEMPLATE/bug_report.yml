name: Bug report / 问题报告
description: 报告可复现的问题，帮助我们修复它
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿粘贴 Vault 笔记正文、密码、令牌或个人隐私路径。提交前请阅读 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 工具版本
      placeholder: "例如：0.5.5"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows 10
        - Windows 11
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: "例如：Python 3.12.2 / Conda"
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序描述操作步骤。
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与错误信息
      description: 请删除用户名、私人路径、令牌和其他隐私后再粘贴。
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 提交前确认
      options:
        - label: 我没有提交笔记正文、密码、令牌或其他敏感信息。
          required: true
        - label: 我已阅读项目安全说明。
          required: true
